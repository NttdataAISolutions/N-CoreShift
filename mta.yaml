## N-CoreShift – Multi-Target Application Deployment Descriptor
## Target: SAP BTP Cloud Foundry
## Build: mbt build  /  Deploy: cf deploy mta_archives/ncoreshift_*.mtar
_schema-version: "3.3.0"
ID: ncoreshift
version: 1.0.0
description: "N-CoreShift – SAP Clean Core Modernization Agent"

parameters:
  enable-parallel-deployments: true
  deploy-mode: blue-green
  ## ── Cross-application identity parameters ────────────────────────────────
  ## Foreign N-CoreIQ xsappname — resolved at deployment time.
  ## Default assumes same-org/same-space co-deployment (same as ncoreiq mta.yaml).
  ## Override for cross-space deployments:
  ##   mbt build --set-param ncoreiq-xsappname=<effective-ncoreiq-xsappname>
  ## or: cf deploy ... --parameter ncoreiq-xsappname=<value>
  ncoreiq-xsappname: ncoreiq-${org}-${space}

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci --workspace=@n-coreshift/srv
        - npm run build --workspace=@n-coreshift/srv
        - npm ci --workspace=@n-coreshift/app
        - npm run build --workspace=@n-coreshift/app

modules:

  # ── Backend: CAP Node.js service ─────────────────────────────────────────────
  - name: ncoreshift-srv
    type: nodejs
    path: srv
    build-parameters:
      builder: custom
      commands: []
      ignore:
        - node_modules/
        - .env
        - "*.local.*"
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
      health-check-type: http
      health-check-http-endpoint: /health
    properties:
      NODE_ENV: production
      NCS_LOG_LEVEL: info
    requires:
      - name: ncoreshift-uaa
        parameters:
          config:
            xsuaa-service-credentials: ~{credentials}
      - name: ncoreshift-db
        parameters:
          config:
            hdi-service-credentials: ~{credentials}
      - name: ncoreshift-destination
      - name: ncoreshift-connectivity
      - name: ncoreshift-objectstore
      - name: ncoreshift-aicore
      - name: ncoreshift-logging
    provides:
      - name: ncoreshift-srv-api
        properties:
          srv-url: ${default-url}

  # ── Python FastAPI: N-CoreIQ runtime ─────────────────────────────────────────
  - name: ncoreshift-python
    type: python
    path: backend
    build-parameters:
      builder: custom
      commands: []
      ignore:
        - .env
        - .env.*
        - .env.example
        - __pycache__/
        - "*.pyc"
        - .pytest_cache/
        - tests/
        - "*.db"
        - "*.sqlite"
        - "*.sqlite3"
        - "*.log"
        - coverage/
        - htmlcov/
        - uploads/
        - generated-artifacts/
        - "*.zip"
        - "*.mtar"
        - .vscode/
        - .idea/
    parameters:
      buildpack: python_buildpack
      memory: 512M
      disk-quota: 1024M
      instances: 1
      health-check-type: http
      health-check-http-endpoint: /api/health
    properties:
      PYTHON_ENV: production
      NCOREIQ_AUTH_MODE: xsuaa
      NCOREIQ_BASE_URL: https://ncoreiq.cfapps.us10.hana.ondemand.com
    requires:
      - name: ncoreshift-uaa
    provides:
      - name: ncoreshift-python-api
        properties:
          python-url: ${default-url}

  # ── Frontend: App Router + HTML5 application ──────────────────────────────────
  - name: ncoreshift-app
    type: approuter.nodejs
    path: app
    build-parameters:
      builder: custom
      commands: []
      ignore:
        - node_modules/
        - .env
    parameters:
      memory: 256M
      disk-quota: 512M
      health-check-type: port
    properties:
      TENANT_HOST_PATTERN: "^(.*)-${default-uri}"
    requires:
      - name: ncoreshift-uaa
      - name: ncoreshift-srv-api
        group: destinations
        properties:
          name: ncoreshift-srv
          url: ~{srv-url}
          forwardAuthToken: true
      - name: ncoreshift-python-api
        group: destinations
        properties:
          name: ncoreshift-python
          url: ~{python-url}
          forwardAuthToken: true
      - name: ncoreshift-logging

  # ── HDI container deployer ────────────────────────────────────────────────────
  - name: ncoreshift-db-deployer
    type: hdb
    path: db
    build-parameters:
      ignore:
        - node_modules/
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    requires:
      - name: ncoreshift-db

resources:

  # ── XSUAA (Authorization & Trust Management) ──────────────────────────────────
  - name: ncoreshift-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: ncoreshift-${org}-${space}
        tenant-mode: shared
        ## Cross-application authorities — deployment-time substitution.
        ## These override the (absent) authorities array in xs-security.json.
        ## MTA replaces the top-level "authorities" key; no duplication occurs.
        ## ${ncoreiq-xsappname} resolves to the effective N-CoreIQ xsappname
        ## (default: ncoreiq-${org}-${space}; overridable for cross-space).
        ## Operator and Admin are intentionally NOT listed (least privilege).
        authorities:
          - "$XSAPPNAME(application,${ncoreiq-xsappname}).NCoreIQ.Viewer"
          - "$XSAPPNAME(application,${ncoreiq-xsappname}).NCoreIQ.Analyst"

  # ── SAP HANA Cloud (HDI container) ────────────────────────────────────────────
  - name: ncoreshift-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-service-name: ${service-name}

  # ── Destination Service ────────────────────────────────────────────────────────
  - name: ncoreshift-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  # ── Connectivity Service ────────────────────────────────────────────────────────
  - name: ncoreshift-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite

  # ── Object Store Service ───────────────────────────────────────────────────────
  - name: ncoreshift-objectstore
    type: org.cloudfoundry.managed-service
    parameters:
      service: objectstore
      service-plan: s3-standard
      config:
        region: us-east-1

  # ── SAP AI Core (Generative AI Hub) ───────────────────────────────────────────
  - name: ncoreshift-aicore
    type: org.cloudfoundry.managed-service
    parameters:
      service: aicore
      service-plan: extended
      config:
        servicePlanTier: extended

  # ── Application Logging Service ────────────────────────────────────────────────
  - name: ncoreshift-logging
    type: org.cloudfoundry.managed-service
    parameters:
      service: application-logs
      service-plan: lite
